<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <script type="importmap">
    {
      "imports": {
        "@mulsense/xnew": "../../../dist/xnew.mjs"
      }
    }
  </script>
  <script src="../../../thirdparty/tailwindcss/playcdn.js"></script>
</head>

<body class="m-0 p-0 w-full h-screen overflow-hidden">
  <div id="main" class="relative w-full h-full"></div>
  <script type="module">
    import { xnew, xaudio, xbasics } from '@mulsense/xnew';

    //----------------------------------------------------------------------------------------------------
    // note / keyboard constants
    //----------------------------------------------------------------------------------------------------

    const NOTES = ['C', 'C#', 'D', 'D#', 'E', 'F', 'F#', 'G', 'G#', 'A', 'A#', 'B'];
    const KEY_W = 28, KEY_H = 110, BKEY_W = 18, BKEY_H = 68;
    const BLACK_OFFSETS = { 'C#': 0, 'D#': 1, 'F#': 3, 'G#': 4, 'A#': 5 };

    // qwerty note keys: A..J = C..B of the base octave, K = C of the next octave
    const KEYCODES = { KeyA: 0, KeyW: 1, KeyS: 2, KeyE: 3, KeyD: 4, KeyF: 5, KeyT: 6, KeyG: 7, KeyY: 8, KeyH: 9, KeyU: 10, KeyJ: 11, KeyK: 12 };
    const KEYCHARS = ['A', 'W', 'S', 'E', 'D', 'F', 'T', 'G', 'Y', 'H', 'U', 'J'];
    const BASE_OCTAVE = 4;
    const OCTAVE_MIN = 4, OCTAVE_MAX = 5;

    //----------------------------------------------------------------------------------------------------
    // presets — each fully specifies every parameter group, so applying one resets the whole state
    //----------------------------------------------------------------------------------------------------

    const PRESETS = {
      init: {
        oscillator: { type: 'square' },
        pitch:  { enabled: false, amount: 12, attack: 0, decay: 200, sustain: 0, release: 0 },
        lfo:    { enabled: false, type: 'sine', amount: 0.5, rate: 6 },
        filter: { enabled: false, type: 'lowpass', cutoff: 2000 },
        amp:    { amount: 0.3, attack: 10, decay: 300, sustain: 0.5, release: 200 },
        reverb: { enabled: false, time: 1000, mix: 0.3 },
      },
      pluck: {
        oscillator: { type: 'sawtooth' },
        pitch:  { enabled: false, amount: 12, attack: 0, decay: 200, sustain: 0, release: 0 },
        lfo:    { enabled: false, type: 'sine', amount: 0.5, rate: 6 },
        filter: { enabled: true, type: 'lowpass', cutoff: 1500 },
        amp:    { amount: 0.35, attack: 0, decay: 250, sustain: 0, release: 100 },
        reverb: { enabled: false, time: 1000, mix: 0.3 },
      },
      organ: {
        oscillator: { type: 'sine' },
        pitch:  { enabled: false, amount: 12, attack: 0, decay: 200, sustain: 0, release: 0 },
        lfo:    { enabled: true, type: 'sine', amount: 0.5, rate: 6 },
        filter: { enabled: false, type: 'lowpass', cutoff: 2000 },
        amp:    { amount: 0.3, attack: 20, decay: 0, sustain: 1, release: 80 },
        reverb: { enabled: true, time: 600, mix: 0.2 },
      },
      bass: {
        oscillator: { type: 'square' },
        pitch:  { enabled: false, amount: 12, attack: 0, decay: 200, sustain: 0, release: 0 },
        lfo:    { enabled: false, type: 'sine', amount: 0.5, rate: 6 },
        filter: { enabled: true, type: 'lowpass', cutoff: 400 },
        amp:    { amount: 0.4, attack: 0, decay: 300, sustain: 0.3, release: 80 },
        reverb: { enabled: false, time: 1000, mix: 0.3 },
      },
      bell: {
        oscillator: { type: 'triangle' },
        pitch:  { enabled: true, amount: 12, attack: 0, decay: 60, sustain: 0, release: 0 },
        lfo:    { enabled: false, type: 'sine', amount: 0.5, rate: 6 },
        filter: { enabled: false, type: 'lowpass', cutoff: 2000 },
        amp:    { amount: 0.3, attack: 0, decay: 900, sustain: 0, release: 400 },
        reverb: { enabled: true, time: 1500, mix: 0.4 },
      },
      pad: {
        oscillator: { type: 'sawtooth' },
        pitch:  { enabled: false, amount: 12, attack: 0, decay: 200, sustain: 0, release: 0 },
        lfo:    { enabled: true, type: 'sine', amount: 0.3, rate: 5 },
        filter: { enabled: true, type: 'lowpass', cutoff: 900 },
        amp:    { amount: 0.25, attack: 500, decay: 400, sustain: 0.7, release: 800 },
        reverb: { enabled: true, time: 1800, mix: 0.5 },
      },
    };

    // parameter groups, one per panel tab
    const TABS = ['oscillator', 'filter', 'amp', 'reverb'];

    // panel-edited state, and the live props object of the single Synthesizer instance
    const state = structuredClone(PRESETS.init);
    const options = {};

    xnew(document.querySelector('#main'), Main);

    //----------------------------------------------------------------------------------------------------
    // app root — owns the synth instance and the held-note table
    //----------------------------------------------------------------------------------------------------

    function Main(unit) {
      xnew.nest('<div class="w-full h-full overflow-auto select-none bg-stone-100 text-stone-800 p-3">');

      applyOptions();
      const synth = xaudio.synthesizer(options);
      const held = new Map();

      xnew('<div class="flex items-center gap-2 mb-2">', () => {
        xnew('<div class="text-base font-semibold text-stone-700 mr-auto">', 'Synthesizer');
        xnew(xbasics.VolumeController, { placement: 'left', className: 'size-6 text-stone-500' });
      });

      xnew(Piano);

      xnew('<div class="mt-3 flex flex-col gap-3 w-128">', () => {
        xnew(ControlPanel);
        xnew(Console);
      });

      xnew(KeyboardInput);

      return {
        press(note) {
          if (!held.has(note)) {
            held.set(note, { handle: synth.press(note), time: Date.now() });
            xnew.emit('+notedown', { note });
          }
        },
        release(note) {
          const entry = held.get(note);
          if (entry) {
            held.delete(note);
            entry.handle.release();
            xnew.emit('+noteup', { note, duration: Date.now() - entry.time });
          }
        },
      };
    }

    //----------------------------------------------------------------------------------------------------
    // piano keyboard
    //----------------------------------------------------------------------------------------------------

    function Piano(unit) {
      xnew.nest('<div class="overflow-x-auto pb-1">');
      xnew.nest('<div class="inline-block rounded-xl bg-stone-900 px-3 pb-3 pt-2 shadow-xl">');
      xnew('<div class="h-1.5 mb-1 rounded-sm bg-red-900">');
      xnew('<div class="flex gap-px">', () => {
        for (let octave = OCTAVE_MIN; octave <= OCTAVE_MAX; octave++) {
          xnew('<div class="relative flex gap-px">', () => {
            for (const name of ['C', 'D', 'E', 'F', 'G', 'A', 'B']) {
              xnew(PianoKey, { note: name + octave });
            }
            for (const name of Object.keys(BLACK_OFFSETS)) {
              xnew(PianoKey, { note: name + octave });
            }
          });
        }
      });
    }

    function PianoKey(unit, { note }) {
      const app = xnew.context(Main);
      const name = note.slice(0, -1);
      const black = name.includes('#');

      let releasedBackground = null;
      let pressedBackground = null;
      let badge = null;
      if (black) {
        const left = (BLACK_OFFSETS[name] + 1) * (KEY_W + 1) - BKEY_W / 2;
        xnew.nest(`<div class="absolute top-0 z-10 cursor-pointer touch-none rounded-b-[4px] shadow-md flex flex-col-reverse items-center" style="width: ${BKEY_W}px; height: ${BKEY_H}px; left: ${left}px;">`);
        releasedBackground = 'linear-gradient(to bottom, #0c0a09, #44403c)';
        pressedBackground = '#57534e';
        badge = xnew('<div class="mb-1 w-3.5 h-3.5 rounded-sm text-[9px] leading-none flex items-center justify-center bg-stone-600 text-stone-200">');
      } else {
        xnew.nest(`<div class="cursor-pointer touch-none rounded-b-[4px] flex flex-col-reverse items-center" style="width: ${KEY_W}px; height: ${KEY_H}px;">`);
        releasedBackground = 'linear-gradient(to bottom, #ffffff, #e7e5e4)';
        pressedBackground = '#d6d3d1';
        xnew('<div class="mb-1 text-[9px] leading-none text-stone-400">', note);
        badge = xnew('<div class="mb-1 w-3.5 h-3.5 rounded-sm text-[9px] leading-none flex items-center justify-center border border-stone-300 bg-white/70 text-stone-500">');
      }
      unit.current.style.background = releasedBackground;

      // qwerty badge for the keys the physical keyboard maps to
      const char = charForNote(note);
      if (char) {
        badge.current.textContent = char;
      } else {
        badge.current.style.visibility = 'hidden';
      }

      unit.on('+notedown', ({ note: pressed }) => {
        if (pressed === note) unit.current.style.background = pressedBackground;
      });
      unit.on('+noteup', ({ note: released }) => {
        if (released === note) unit.current.style.background = releasedBackground;
      });

      unit.on('pointerdown', () => app.press(note));
      unit.on('pointerenter', ({ event }) => {
        if (event.buttons === 1) app.press(note);
      });
      unit.on('pointerup pointerleave pointercancel', () => app.release(note));
    }

    function charForNote(note) {
      const name = note.slice(0, -1);
      const octave = Number(note.slice(-1));
      if (octave === BASE_OCTAVE) {
        return KEYCHARS[NOTES.indexOf(name)];
      } else if (octave === BASE_OCTAVE + 1 && name === 'C') {
        return 'K';
      } else {
        return null;
      }
    }

    //----------------------------------------------------------------------------------------------------
    // qwerty keyboard input
    //----------------------------------------------------------------------------------------------------

    function KeyboardInput(unit) {
      const app = xnew.context(Main);
      const down = new Map();

      unit.on('window.keydown', ({ event }) => {
        if (!event.repeat && !event.metaKey && !event.ctrlKey && !event.altKey) {
          const index = KEYCODES[event.code];
          if (index !== undefined && !down.has(event.code)) {
            const note = NOTES[index % 12] + (BASE_OCTAVE + Math.floor(index / 12));
            down.set(event.code, note);
            app.press(note);
          }
        }
      });
      unit.on('window.keyup', ({ event }) => {
        const note = down.get(event.code);
        if (note !== undefined) {
          down.delete(event.code);
          app.release(note);
        }
      });
      // keyup is lost when the tab loses focus, so silence everything
      unit.on('window.blur', () => {
        for (const note of down.values()) app.release(note);
        down.clear();
      });
    }

    //----------------------------------------------------------------------------------------------------
    // parameter panel
    //----------------------------------------------------------------------------------------------------

    function ControlPanel(unit) {
      xnew.nest('<div class="w-full">');

      xnew('<div class="flex flex-wrap gap-1.5 mb-2">', () => {
        for (const name of Object.keys(PRESETS)) {
          const chip = xnew('<button class="h-7 px-2.5 text-xs border border-stone-300 rounded-full bg-white text-stone-600 hover:bg-stone-200 cursor-pointer">', name);
          chip.on('click', () => {
            Object.assign(state, structuredClone(PRESETS[name]));
            rebuild();
            emitParams();
          });
        }
      });

      let active = TABS[0];
      const tabs = {};
      xnew('<div class="flex gap-1 mb-2">', () => {
        for (const name of TABS) {
          const tab = xnew('<button>', name);
          tab.on('click', () => {
            active = name;
            rebuild();
          });
          tabs[name] = tab;
        }
      });

      let body = xnew(PanelBody, { tab: active });
      updateTabs();

      function rebuild() {
        body.finalize();
        body = xnew(unit, PanelBody, { tab: active });
        updateTabs();
      }

      function updateTabs() {
        for (const [name, tab] of Object.entries(tabs)) {
          tab.current.className = 'flex-1 h-8 px-2 text-xs rounded-md border cursor-pointer ' +
            (active === name ? 'border-stone-700 bg-stone-700 text-white' : 'border-stone-300 bg-white text-stone-600 hover:bg-stone-200');
        }
      }
    }

    function PanelBody(unit, { tab }) {
      xnew.nest('<div class="text-sm border border-stone-300 rounded-lg bg-white text-stone-700 shadow-sm overflow-hidden">');

      if (tab === 'oscillator') {
        xnew(WaveSelect, { target: state.oscillator });
        const panel = xnew(xbasics.Panel);
        toggleGroup(panel, 'pitch envelope', state.pitch, (sub) => {
          sub.range({ name: 'amount', min: -24, max: 24, step: 1 }).on('input', emitParams);
          envelopeRows(sub);
        });
        toggleGroup(panel, 'LFO', state.lfo, (sub) => {
          xnew(WaveSelect, { target: state.lfo });
          sub.range({ name: 'amount', min: 0, max: 12, step: 0.5 }).on('input', emitParams);
          sub.range({ name: 'rate', min: 1, max: 20, step: 1 }).on('input', emitParams);
        });
      } else if (tab === 'filter') {
        const panel = xnew(xbasics.Panel, { params: state.filter });
        toggleSection(panel, state.filter, (sub) => {
          sub.listbox({ name: 'type', items: ['lowpass', 'highpass', 'bandpass'] }).on('-change', emitParams);
          sub.range({ name: 'cutoff', min: 100, max: 8000, step: 100 }).on('input', emitParams);
        });
      } else if (tab === 'amp') {
        xnew(EnvelopeCurve, { env: state.amp });
        const panel = xnew(xbasics.Panel, { params: state.amp });
        panel.range({ name: 'amount', min: 0, max: 1, step: 0.05 }).on('input', emitParams);
        envelopeRows(panel);
      } else if (tab === 'reverb') {
        const panel = xnew(xbasics.Panel, { params: state.reverb });
        toggleSection(panel, state.reverb, (sub) => {
          sub.range({ name: 'time', min: 100, max: 2000, step: 100 }).on('input', emitParams);
          sub.range({ name: 'mix', min: 0, max: 1, step: 0.05 }).on('input', emitParams);
        });
      }
    }

    // named group with an 'enabled' checkbox that opens / closes its parameter rows
    function toggleGroup(panel, name, params, inner) {
      panel.group({ name, params, open: params.enabled }, (group) => {
        const enabled = group.checkbox({ name: 'enabled' });
        const sub = group.group({ open: params.enabled }, inner);
        enabled.on('input', ({ value }) => {
          value ? sub.gate.open() : sub.gate.close();
          emitParams();
        });
      });
    }

    // an 'enabled' checkbox and its parameter rows filling the whole tab (no group header)
    function toggleSection(panel, params, inner) {
      const enabled = panel.checkbox({ name: 'enabled' });
      const sub = panel.group({ open: params.enabled, params }, inner);
      enabled.on('input', ({ value }) => {
        value ? sub.gate.open() : sub.gate.close();
        emitParams();
      });
    }

    function envelopeRows(group) {
      group.range({ name: 'attack', min: 0, max: 1000, step: 10 }).on('input', emitParams);
      group.range({ name: 'decay', min: 0, max: 1000, step: 10 }).on('input', emitParams);
      group.range({ name: 'sustain', min: 0, max: 1, step: 0.05 }).on('input', emitParams);
      group.range({ name: 'release', min: 0, max: 1000, step: 10 }).on('input', emitParams);
    }

    function WaveSelect(unit, { target }) {
      const shapes = {
        sine: 'M0 10 Q5 -4 10 10 T20 10',
        triangle: 'M0 10 L5 2 L15 18 L20 10',
        square: 'M0 16 L0 4 L10 4 L10 16 L20 16 L20 4',
        sawtooth: 'M0 16 L10 4 L10 16 L20 4',
      };
      xnew.nest('<div class="flex gap-1 m-1 justify-center">');

      const buttons = {};
      const update = () => {
        for (const [type, button] of Object.entries(buttons)) {
          button.current.className = 'w-9 h-7 border rounded flex items-center justify-center cursor-pointer ' +
            (target.type === type ? 'border-stone-700 bg-stone-700 text-white' : 'border-stone-300 bg-white text-stone-400 hover:bg-stone-100');
        }
      };
      for (const [type, d] of Object.entries(shapes)) {
        const button = xnew(`<button title="${type}">`);
        button.current.innerHTML = `<svg viewBox="0 0 20 20" class="w-5 h-4" fill="none" stroke="currentColor" stroke-width="2"><path d="${d}"/></svg>`;
        button.on('click', () => {
          target.type = type;
          update();
          emitParams();
        });
        buttons[type] = button;
      }
      update();
    }

    function EnvelopeCurve(unit, { env }) {
      const SUSTAIN_HOLD = 500;
      // fixed time scale: A / D / R each cap at 1000ms, so the curve reaches the right edge only at max
      const scale = 260 / (3 * 1000 + SUSTAIN_HOLD);
      xnew.nest('<svg class="block h-16 mx-1 my-1 rounded bg-stone-800" viewBox="0 0 260 80" preserveAspectRatio="none">');
      const draw = () => {
        const y = (level) => 76 - 68 * level;
        const peak = env.amount;
        const end = env.attack + env.decay + SUSTAIN_HOLD + env.release;
        const points = [
          `0,${y(0)}`,
          `${env.attack * scale},${y(peak)}`,
          `${(env.attack + env.decay) * scale},${y(peak * env.sustain)}`,
          `${(env.attack + env.decay + SUSTAIN_HOLD) * scale},${y(peak * env.sustain)}`,
          `${end * scale},${y(0)}`,
        ].join(' ');
        unit.current.innerHTML = `<polyline points="${points}" fill="rgba(52, 211, 153, 0.15)" stroke="#34d399" stroke-width="2"/>`;
      };
      draw();
      unit.on('+params', draw);
    }

    //----------------------------------------------------------------------------------------------------
    // code console
    //----------------------------------------------------------------------------------------------------

    function Console(unit) {
      xnew.nest('<div class="w-full rounded-lg bg-stone-800 shadow-sm overflow-hidden">');

      xnew('<div class="flex items-center justify-between px-3 h-9 bg-stone-900">', () => {
        xnew('<div class="text-xs text-stone-400">', 'generated code');
        const copy = xnew('<button class="h-6 px-2 text-xs border border-stone-600 rounded text-stone-300 hover:bg-stone-700 cursor-pointer">', 'copy');
        copy.on('click', () => {
          navigator.clipboard.writeText(`${setup.current.textContent}\n${play.current.textContent}`);
          copy.current.textContent = 'copied';
          xnew.timeout(() => copy.current.textContent = 'copy', 800);
        });
      });

      const setup = xnew('<pre class="select-text px-3 pt-2 m-0 text-xs leading-5 text-stone-100 whitespace-pre-wrap">');
      const play = xnew('<pre class="select-text px-3 pb-3 m-0 text-xs leading-5 text-emerald-300 whitespace-pre-wrap">');

      const update = () => setup.current.textContent = synthesizerCode();
      update();
      unit.on('+params', update);

      play.current.textContent = '// click a key or type A W S E D F T G Y H U J K';
      unit.on('+notedown', ({ note }) => play.current.textContent = `const note = synth.press('${note}');`);
      unit.on('+noteup', ({ note, duration }) => play.current.textContent = `synth.press('${note}', ${duration});`);
    }

    //----------------------------------------------------------------------------------------------------
    // state -> synthesizer options / code string
    //----------------------------------------------------------------------------------------------------

    function emitParams() {
      applyOptions();
      xnew.emit('+params', {});
    }

    // rebuild the live props object in place, so the single synth instance follows the panel
    function applyOptions() {
      options.oscillator = { type: state.oscillator.type };
      if (state.pitch.enabled) {
        options.oscillator.envelope = envelopeOf(state.pitch);
      }
      if (state.lfo.enabled) {
        options.oscillator.LFO = { type: state.lfo.type, amount: state.lfo.amount, rate: state.lfo.rate };
      }
      if (state.filter.enabled) {
        options.filter = { type: state.filter.type, cutoff: state.filter.cutoff };
      } else {
        delete options.filter;
      }
      options.amp = { envelope: envelopeOf(state.amp) };
      if (state.reverb.enabled) {
        options.reverb = { time: state.reverb.time, mix: state.reverb.mix };
      } else {
        delete options.reverb;
      }
    }

    function envelopeOf(env) {
      return { amount: env.amount, ADSR: [env.attack, env.decay, env.sustain, env.release] };
    }

    function synthesizerCode() {
      const lines = ['const synth = xaudio.synthesizer({'];
      if (state.pitch.enabled || state.lfo.enabled) {
        lines.push('  oscillator: {');
        lines.push(`    type: '${state.oscillator.type}',`);
        if (state.pitch.enabled) {
          lines.push(`    envelope: ${envelopeCode(state.pitch)},`);
        }
        if (state.lfo.enabled) {
          lines.push(`    LFO: { type: '${state.lfo.type}', amount: ${state.lfo.amount}, rate: ${state.lfo.rate} },`);
        }
        lines.push('  },');
      } else {
        lines.push(`  oscillator: { type: '${state.oscillator.type}' },`);
      }
      if (state.filter.enabled) {
        lines.push(`  filter: { type: '${state.filter.type}', cutoff: ${state.filter.cutoff} },`);
      }
      lines.push(`  amp: { envelope: ${envelopeCode(state.amp)} },`);
      if (state.reverb.enabled) {
        lines.push(`  reverb: { time: ${state.reverb.time}, mix: ${state.reverb.mix} },`);
      }
      lines.push('});');
      return lines.join('\n');
    }

    function envelopeCode(env) {
      return `{ amount: ${env.amount}, ADSR: [${env.attack}, ${env.decay}, ${env.sustain}, ${env.release}] }`;
    }

  </script>
</body>
</html>
