<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <script type="importmap">
    {
      "imports": {
        "@mulsense/xnew": "../../../dist/xnew.mjs"
      }
    }
  </script>
  <script src="../../../thirdparty/tailwindcss/playcdn.js"></script>
  <style>
    /* an unlayered page class: every property it declares replaces the @layer base default,
       no matter its specificity or where it appears in the page */
    .custom {
      border: none;
      border-radius: 9999px;
      background: #4f46e5;
      color: #ffffff;
    }
  </style>
</head>

<body class="m-0 p-0 w-full h-screen">
  <div id="main" class="relative w-full h-full"></div>
  <script type="module">
    import { xnew, xbasics, xicons } from '@mulsense/xnew';

    xnew(document.querySelector('#main'), (unit) => {
      xnew.nest('<div class="m-2 p-4 w-[36rem] text-sm text-green-900 bg-gray-100 border rounded-lg shadow-lg flex flex-col gap-4">');

      xnew(MyButton);
      xnew(MyInputText);
      xnew(MyInputNumber);
      xnew(MyInputCheckbox);
      xnew(MyInputSwitch);
      xnew(MyInputRadio);
      xnew(MyListBox);
      xnew(MyInputRange);
    });

    // each block: the default look next to a designed variant

    function MyButton(unit) {
      xnew.nest('<div>');
      xnew('<div class="mb-1">', 'Button');
      xnew.nest('<div class="flex gap-4 items-center">');
      xnew(xbasics.Button, { text: 'default' });
      xnew(xbasics.Button, { text: 'custom', className: 'custom' });
    }

    function MyInputText(unit) {
      xnew.nest('<div>');
      xnew('<div class="mb-1">', 'InputText');
      xnew.nest('<div class="flex gap-4 items-center">');
      xnew(xbasics.InputText, { placeholder: 'default' });
      xnew(xbasics.InputText, { placeholder: 'rounded', style: 'border-radius: 9999px; padding: 0 0.8em;' });
    }

    function MyInputNumber(unit) {
      xnew.nest('<div>');
      xnew('<div class="mb-1">', 'InputNumber');
      xnew.nest('<div class="flex gap-4 items-center">');
      xnew(xbasics.InputNumber, { value: 10, min: 0, max: 100, step: 5 });
      xnew(xbasics.InputNumber, { value: 50, min: 0, max: 100, className: 'text-rose-500' });
    }

    function MyInputCheckbox(unit) {
      xnew.nest('<div>');
      xnew('<div class="mb-1">', 'InputCheckbox');
      xnew.nest('<div class="flex gap-4 items-center">');
      xnew(xbasics.InputCheckbox, { value: true });
      xnew(xbasics.InputCheckbox, { value: true, style: 'border-radius: 50%;' });
      // compose a custom mark: a trailing function nests it into the box and follows the checked gate
      xnew(xbasics.InputCheckbox, { value: true }, (unit) => {
        const mark = xnew(xicons.Check, { mode: 'solid', style: 'position: absolute; inset: 0; width: 100%; height: 100%; color: red;' });
        unit.gate.on('-transition', ({ value }) => mark.element.style.opacity = value);
      });
    }

    function MyInputSwitch(unit) {
      xnew.nest('<div>');
      xnew('<div class="mb-1">', 'InputSwitch');
      xnew.nest('<div class="flex gap-4 items-center">');
      xnew(xbasics.InputSwitch, { value: true });
      xnew(xbasics.InputSwitch, { value: true, style: 'border-radius: 0.25em;', attributes: { knob: { style: 'border-radius: 0.25em; background: #4f46e5;' } } });
    }

    function MyInputRadio(unit) {
      xnew.nest('<div>');
      xnew('<div class="mb-1">', 'InputRadio');
      xnew.nest('<div class="flex gap-4 items-center">');
      xnew('<div class="h-8 w-56 flex border rounded overflow-hidden">', () => {
        xnew(xbasics.InputRadio, { name: 'level1', value: 'low' });
        xnew(xbasics.InputRadio, { name: 'level1', value: 'mid', checked: true });
        xnew(xbasics.InputRadio, { name: 'level1', value: 'high' });
      });
      xnew('<div class="h-8 w-56 flex border rounded-full overflow-hidden">', () => {
        xnew(xbasics.InputRadio, { name: 'level2', value: 'low', style: 'font-weight: bold;' });
        xnew(xbasics.InputRadio, { name: 'level2', value: 'mid', style: 'font-weight: bold;' });
        xnew(xbasics.InputRadio, { name: 'level2', value: 'high', checked: true, style: 'font-weight: bold;' });
      });
    }

    function MyListBox(unit) {
      xnew.nest('<div>');
      xnew('<div class="mb-1">', 'Listbox');
      xnew.nest('<div class="flex gap-4 items-center">');
      xnew(xbasics.Listbox, (listbox) => {
        xnew(xicons.ChevronDown, { className: 'flex-none size-[0.9em]' });
        xnew(xbasics.ListboxMenu, () => {
          xnew(xbasics.ListboxItem, { value: 'apple' });
          xnew(xbasics.ListboxItem, { value: 'banana' });
          xnew(xbasics.ListboxItem, { value: 'cherry' });
        });
      });
      // the Listbox owns the Gate (duration 200): ListboxMenu opens / closes it, and the Accordion
      // (after the menu, so its collapse box wraps the rows) rides the same box.gate to animate in step
      xnew(xbasics.Listbox, { value: 'banana', gate: { open: false, duration: 200 }, style: 'border-radius: 9999px;' }, (listbox) => {
        xnew(xicons.ChevronUpDown, { className: 'flex-none size-[0.9em]' });
        xnew(xbasics.ListboxMenu, { className: 'border-green-700' }, (menu) => {
          xnew.extend(xbasics.Accordion, { gate: listbox.gate });
          [{ value: 'apple', icon: xicons.Heart }, { value: 'banana', icon: xicons.Bolt }, { value: 'cherry', icon: xicons.Fire }].forEach(({ value, icon }) => {
            xnew(xbasics.ListboxItem, { value }, (item) => {
              xnew(icon, { className: 'flex-none size-5 mr-2' });
              xnew('<span style="font-style: italic;">', value);
            });
          });
        });
      });
    }

    function MyInputRange(unit) {
      xnew.nest('<div>');
      xnew('<div class="mb-1">', 'InputRange');
      xnew.nest('<div class="flex gap-4 items-center">');
      xnew(xbasics.InputRange, { value: 30 });
      // compose a custom inner design: a sliding knob on a thin track instead of the filling gauge (no outer frame)
      xnew(xbasics.InputRange, { value: 50, style: 'box-shadow: none;' }, (range) => {
        xnew('<div class="absolute inset-x-2 top-1/2 h-1 -translate-y-1/2 rounded-full bg-indigo-200 pointer-events-none">');
        const knob = xnew('<div class="absolute top-1/2 size-4 -translate-x-1/2 -translate-y-1/2 rounded-full bg-indigo-600 shadow pointer-events-none">');
        function move(value) {
          knob.element.style.left = `calc(0.5rem + (100% - 1rem) * ${value / 100})`;
        }
        move(50);
        range.on('input', ({ value }) => move(value));
      });
      xnew(xbasics.InputRange, { value: 40, vertical: true });
      // the same knob design on the vertical axis: value grows upward, so the knob slides via bottom
      xnew(xbasics.InputRange, { value: 70, vertical: true, style: 'box-shadow: none;' }, (range) => {
        xnew('<div class="absolute inset-y-2 left-1/2 w-1 -translate-x-1/2 rounded-full bg-indigo-200 pointer-events-none">');
        const knob = xnew('<div class="absolute left-1/2 size-4 -translate-x-1/2 translate-y-1/2 rounded-full bg-indigo-600 shadow pointer-events-none">');
        function move(value) {
          knob.element.style.bottom = `calc(0.5rem + (100% - 1rem) * ${value / 100})`;
        }
        move(70);
        range.on('input', ({ value }) => move(value));
      });
    }
  </script>
</body>

</html>
