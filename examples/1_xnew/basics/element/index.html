<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <script type="importmap">
    {
      "imports": {
        "@mulsense/xnew": "../../../dist/xnew.mjs"
      }
    }
  </script>
  <script src="../../../thirdparty/tailwindcss/playcdn.js"></script>
  <style>
    /* an unlayered page class: every property it declares replaces the @layer base default,
       no matter its specificity or where it appears in the page */
    .custom {
      border: none;
      border-radius: 9999px;
      background: #4f46e5;
      color: #ffffff;
    }
  </style>
</head>

<body class="m-0 p-0 w-full h-screen">
  <div id="main" class="relative w-full h-full"></div>
  <script type="module">
    import { xnew, xbasics, xicons } from '@mulsense/xnew';

    xnew(document.querySelector('#main'), (unit) => {
      xnew.nest('<div class="m-2 p-4 text-sm text-green-900 bg-gray-100 border rounded-lg shadow-lg flex flex-wrap content-start gap-x-6 gap-y-3">');

      xnew(MyButton);
      xnew(MyInputText);
      xnew(MyInputNumber);
      xnew(MyInputCheckbox);
      xnew(MyInputSwitch);
      xnew(MyInputRadio);
      xnew(MyListbox);
      xnew(MyInputRange);
      xnew(MySVGText);
    });

    // each block: the default look next to a designed variant

    function MyButton(unit) {
      xnew.nest('<div>');
      xnew('<div class="mb-1">', 'Button');
      xnew.nest('<div class="flex gap-4 items-center">');
      xnew(xbasics.Button, { text: 'default' });
      xnew(xbasics.Button, { text: 'custom', className: 'custom' });
      // disabled works the same on every element: the container gets data-disabled and dims itself
      xnew(xbasics.Button, { text: 'disabled', disabled: true });
    }

    function MyInputText(unit) {
      xnew.nest('<div>');
      xnew('<div class="mb-1">', 'InputText');
      xnew.nest('<div class="flex gap-4 items-center">');
      xnew(xbasics.InputText, { placeholder: 'default' });
      xnew(xbasics.InputText, { placeholder: 'rounded', style: 'border-radius: 9999px; padding: 0 0.8em;' });
    }

    function MyInputNumber(unit) {
      xnew.nest('<div>');
      xnew('<div class="mb-1">', 'InputNumber');
      xnew.nest('<div class="flex gap-4 items-center">');
      xnew(xbasics.InputNumber, { value: 10, min: 0, max: 100, step: 5 });
      xnew(xbasics.InputNumber, { value: 50, min: 0, max: 100, className: 'text-rose-500' });
    }

    function MyInputCheckbox(unit) {
      xnew.nest('<div>');
      xnew('<div class="mb-1">', 'InputCheckbox');
      xnew.nest('<div class="flex gap-4 items-center">');
      xnew(xbasics.InputCheckbox, { value: true });
      xnew(xbasics.InputCheckbox, { value: true, style: 'border-radius: 50%;' });
      // compose a custom mark: xnew.extend puts InputCheckbox on this unit, so the mark nests into the box
      // and fades itself off the container's data-checked, exactly like the default CheckMark
      xnew(() => {
        xnew.extend(xbasics.InputCheckbox, { value: true });
        const css = xnew.css({
          mark: `
            position: absolute; inset: 0; width: 100%; height: 100%; color: red;
            opacity: 0; transition: opacity 0.2s;
            [data-checked] > & { opacity: 1; }
          `,
        });
        xnew(xicons.Check, { mode: 'solid', className: css.mark });
      });
    }

    function MyInputSwitch(unit) {
      xnew.nest('<div>');
      xnew('<div class="mb-1">', 'InputSwitch');
      xnew.nest('<div class="flex gap-4 items-center">');
      xnew(xbasics.InputSwitch, { value: true });
      // compose a custom knob with xnew.css, driven off the container's data-checked like the default Knob:
      // the [data-checked] > & rule slides it (the InputSwitch toggles data-checked on its container)
      xnew(() => {
        xnew.extend(xbasics.InputSwitch, { value: true, className: 'rounded' });
        const css = xnew.css({
          knob: `
            position: absolute; top: 0.15em; bottom: 0.15em; left: 0.15em;
            aspect-ratio: 1 / 1; border-radius: 0.25em;
            background: #4f46e5;
            transition: left 0.15s, transform 0.15s;
            [data-checked] > & { left: calc(100% - 0.15em); transform: translateX(-100%); }
          `,
        });
        xnew.nest({ tag: 'div', className: css.knob });
      });
    }

    function MyInputRadio(unit) {
      xnew.nest('<div>');
      xnew('<div class="mb-1">', 'InputRadioGroup');
      xnew.nest('<div class="flex gap-4 items-center">');
      // the group owns the frame and the shared name, so a whole strip is one call
      xnew(xbasics.InputRadioGroup, { value: 'mid', items: ['low', 'mid', 'high'], style: 'width: 14rem;' });
      // composed: extend the group onto this unit and nest the segments by hand (labels may differ from values)
      xnew(() => {
        xnew.extend(xbasics.InputRadioGroup, { value: 'high', style: 'width: 14rem; border-radius: 9999px;' });
        xnew(xbasics.InputRadio, { value: 'low', label: 'Low', style: 'font-weight: bold;' });
        xnew(xbasics.InputRadio, { value: 'mid', label: 'Mid', style: 'font-weight: bold;' });
        xnew(xbasics.InputRadio, { value: 'high', label: 'High', style: 'font-weight: bold;' });
      });
    }

    function MyListbox(unit) {
      xnew.nest('<div>');
      xnew('<div class="mb-1">', 'Listbox');
      xnew.nest('<div class="flex gap-4 items-center">');
      // items だけ渡せば Listbox が既定のトリガ + 一覧を自前で組む（{ value, label } でラベルを分けられる）
      xnew(xbasics.Listbox, { items: ['apple', 'banana', 'cherry'] });
      xnew(xbasics.Listbox, { items: [{ value: 'apple', label: 'りんご' }, { value: 'banana', label: 'ばなな' }], value: 'banana' });
      xnew(() => {
        xnew.extend(xbasics.Listbox);
        xnew(() => {
          xnew.extend(xbasics.ListboxButton);
          xnew(xicons.ChevronDown, { className: 'flex-none size-[0.9em]' });
        });
        xnew(() => {
          xnew.extend(xbasics.ListboxMenu);
          xnew(xbasics.ListboxItem, { value: 'apple' });
          xnew(xbasics.ListboxItem, { value: 'banana' });
          xnew(xbasics.ListboxItem, { value: 'cherry' });
        });
      });
      // the Listbox owns the Gate, built from its own duration: ListboxButton opens / closes it, and the
      // Accordion (after the menu, so its collapse box wraps the rows) rides the same box.gate to animate in step
      xnew((listbox) => {
        xnew.extend(xbasics.Listbox, { value: 'banana', duration: 200 });
        xnew(() => {
          xnew.extend(xbasics.ListboxButton, { style: 'border-radius: 9999px;' });
          xnew(xicons.ChevronUpDown, { className: 'flex-none size-[0.9em]' });
        });
        xnew(() => {
          xnew.extend(xbasics.ListboxMenu, { className: 'border-green-700' });
          xnew.extend(xbasics.Accordion, { gate: listbox.gate });
          [{ value: 'apple', icon: xicons.Heart }, { value: 'banana', icon: xicons.Bolt }, { value: 'cherry', icon: xicons.Fire }].forEach(({ value, icon }) => {
            xnew(() => {
              xnew.extend(xbasics.ListboxItem, { value });
              xnew(icon, { className: 'flex-none size-5 mr-2' });
              xnew('<span style="font-style: italic;">', value);
            });
          });
        });
      });
    }

    function MyInputRange(unit) {
      xnew.nest('<div>');
      xnew('<div class="mb-1">', 'InputRange');
      xnew.nest('<div class="flex gap-4 items-center">');
      xnew(xbasics.InputRange, { value: 30 });
      // compose a custom inner design: a sliding knob on a thin track instead of the filling gauge (no outer frame)
      xnew((range) => {
        xnew.extend(xbasics.InputRange, { value: 50, style: 'box-shadow: none;' });
        xnew('<div class="absolute inset-x-2 top-1/2 h-1 -translate-y-1/2 rounded-full bg-indigo-200 pointer-events-none">');
        const knob = xnew('<div class="absolute top-1/2 size-4 -translate-x-1/2 -translate-y-1/2 rounded-full bg-indigo-600 shadow pointer-events-none">');
        function move(value) {
          knob.current.style.left = `calc(0.5rem + (100% - 1rem) * ${value / 100})`;
        }
        move(50);
        range.on('input', ({ value }) => move(value));
      });
      xnew(xbasics.InputRange, { value: 40, vertical: true });
      // the same knob design on the vertical axis: value grows upward, so the knob slides via bottom
      xnew((range) => {
        xnew.extend(xbasics.InputRange, { value: 70, vertical: true, style: 'box-shadow: none;' });
        xnew('<div class="absolute inset-y-2 left-1/2 w-1 -translate-x-1/2 rounded-full bg-indigo-200 pointer-events-none">');
        const knob = xnew('<div class="absolute left-1/2 size-4 -translate-x-1/2 translate-y-1/2 rounded-full bg-indigo-600 shadow pointer-events-none">');
        function move(value) {
          knob.current.style.bottom = `calc(0.5rem + (100% - 1rem) * ${value / 100})`;
        }
        move(70);
        range.on('input', ({ value }) => move(value));
      });
    }

    function MySVGText(unit) {
      xnew.nest('<div>');
      xnew('<div class="mb-1">', 'SVGText');
      xnew.nest('<div class="flex gap-4 items-center">');
      // text drawn as SVG, auto-fitted to its bbox; fill picks up currentColor from the className color
      xnew(xbasics.SVGText, { text: 'default', fontSize: 32, className: 'text-indigo-600' });
      // stroke + fill give a game-style outlined label (paint-order draws the stroke behind the fill)
      xnew('<div class="px-3 py-1 rounded-lg bg-slate-800">', () => {
        xnew(xbasics.SVGText, { text: 'OUTLINE', fontSize: 32, className: 'text-emerald-300', style: 'stroke: #0f172a; stroke-width: 3;' });
      });
    }
  </script>
</body>

</html>
