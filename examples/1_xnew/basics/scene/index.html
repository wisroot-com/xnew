<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <script type="importmap">
    {
      "imports": {
        "@mulsense/xnew": "../../../dist/xnew.mjs"
      }
    }
  </script>
  <script src="../../../thirdparty/tailwindcss/playcdn.js"></script>
</head>

<body class="m-0 p-0 w-full h-screen overflow-hidden">
  <div id="main" class="relative w-full h-full"></div>
  <script type="module">
    import { xnew, xbasics } from '@mulsense/xnew';

    // Scene is the navigator: each scene extends Scene so unit.change swaps this unit for the next
    // one, and unit.add mounts runtime children that die with the scene. The SceneList only holds
    // the label table — create it BEFORE the first scene, then mount the first scene yourself.
    let score = 0; // runtime state shared across scenes (scene props are static)

    xnew(document.querySelector('#main'), (unit) => {
      xnew.nest('<div class="absolute w-96 h-64 inset-0 m-auto border rounded-lg overflow-hidden bg-slate-800 text-white select-none">');
      xnew(xbasics.SceneList, {
        list: {
          title: [Title],
          play: [Play],
          result: [Result],
        },
      });
      xnew(Title);
    });

    function Title(unit) {
      xnew.extend(xbasics.Scene);
      xnew.nest('<div class="size-full flex flex-col items-center justify-center gap-4 cursor-pointer">');
      xnew('<h1 class="text-3xl font-bold">', 'TITLE');
      xnew('<p class="text-slate-400 animate-pulse">', 'click to start');
      unit.on('click', () => unit.change('play'));
    }

    function Play(unit) {
      xnew.extend(xbasics.Scene);
      xnew.nest('<div class="size-full relative">');

      const box = xnew('<div class="absolute w-8 h-8 top-1/2 -mt-4 bg-emerald-400 rounded">');
      score = 0;
      let paused = false;
      unit.on('update', () => {
        if (paused === false) {
          score++;
          box.element.style.left = `${(1 + Math.sin(score * 0.05)) * 50 * 0.88}%`;
        }
      });

      const scoreText = xnew('<p class="absolute top-2 left-3 text-sm text-slate-300">');
      unit.on('update', () => scoreText.element.textContent = `score: ${score}`);

      // unit.add: mounted under this scene, so it is finalized together with it on the next change
      xnew('<button class="absolute top-2 right-3 text-sm px-2 py-1 rounded bg-slate-600 hover:bg-slate-500 cursor-pointer">', 'pause')
        .on('click', () => {
          paused = true;
          unit.add(Pause, { resume: () => paused = false });
        });

      xnew('<button class="absolute bottom-2 right-3 text-sm px-2 py-1 rounded bg-rose-600 hover:bg-rose-500 cursor-pointer">', 'finish')
        .on('click', () => unit.change('result'));
    }

    // Mounted with unit.add, so it stacks on top of Play and is finalized together with it.
    function Pause(unit, { resume }) {
      xnew.nest('<div class="absolute inset-0 bg-black/60 flex flex-col items-center justify-center gap-3">');
      xnew('<p class="text-xl font-bold">', 'PAUSE');
      xnew('<button class="text-sm px-3 py-1 rounded bg-slate-600 hover:bg-slate-500 cursor-pointer">', 'resume')
        .on('click', () => unit.finalize());
      unit.on('finalize', () => resume());
    }

    function Result(unit) {
      xnew.extend(xbasics.Scene);
      xnew.nest('<div class="size-full flex flex-col items-center justify-center gap-4 cursor-pointer">');
      xnew('<h1 class="text-3xl font-bold">', 'RESULT');
      xnew('<p class="text-emerald-400 text-xl">', `score: ${score}`);
      xnew('<p class="text-slate-400 animate-pulse">', 'click to return to title');
      unit.on('click', () => unit.change('title'));
    }
  </script>
</body>

</html>
