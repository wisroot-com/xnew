<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <script type="importmap">
    {
      "imports": {
        "@mulsense/xnew": "../../../dist/xnew.mjs"
      }
    }
  </script>
  <script src="../../../thirdparty/tailwindcss/playcdn.js"></script>
</head>

<body class="m-0 p-0 w-full h-screen">
  <div id="main" class="relative w-full h-full"></div>
  <script type="module">
    import { xnew, xbasics } from '@mulsense/xnew';

    xnew(document.querySelector('#main'), Main);

    function Main(unit) {
      xnew.nest('<div class="p-4 flex flex-col gap-6">');
      xnew(Icons);
      xnew(Texts);
    }

    // xbasics.SVG is an <svg> root with shared presentation defaults (@layer base
    // css: stroke / fill / line caps), so each shape child stays minimal.
    // Override the defaults via className / style — css beats svg attributes.
    // stroke: currentColor picks up the CSS text color set by className.
    function Icons(unit) {
      xnew('<p class="font-bold">', 'xbasics.SVG');
      xnew.nest('<div class="flex gap-2">');

      xnew(Star);
      xnew(Check);
      xnew(Gear);
    }

    function Star(unit) {
      xnew.extend(xbasics.SVG, { viewBox: '0 0 24 24', className: 'size-16 text-amber-500', style: 'stroke: currentColor; stroke-width: 1.5;' });
      xnew('<path d="M12 3 14.8 8.6 21 9.5 16.5 13.9 17.6 20 12 17.1 6.4 20 7.5 13.9 3 9.5 9.2 8.6z">');
    }

    function Check(unit) {
      xnew.extend(xbasics.SVG, { viewBox: '0 0 24 24', className: 'size-16 text-green-600', style: 'stroke: currentColor; stroke-width: 2;' });
      xnew('<path d="M4 12.5 9.5 18 20 6">');
    }

    function Gear(unit) {
      xnew.extend(xbasics.SVG, { viewBox: '0 0 24 24', className: 'size-16 text-blue-600', style: 'stroke: currentColor; stroke-width: 1.5;' });
      xnew('<circle cx="12" cy="12" r="3.5">');
      xnew('<path d="M12 2v3M12 19v3M2 12h3M19 12h3M4.9 4.9l2.1 2.1M17 17l2.1 2.1M19.1 4.9 17 7M7 17l-2.1 2.1">');
    }

    // xbasics.SVGText renders text as SVG and auto-fits the viewBox to the text
    // bounding box; fill / outline / shadow compose CSS-impossible decorated text.
    function Texts(unit) {
      xnew('<p class="font-bold">', 'xbasics.SVGText');
      xnew.nest('<div class="flex flex-col gap-3 items-start">');

      // plain: inherits currentColor from the CSS text color
      xnew('<div class="text-indigo-600">', () => {
        xnew(xbasics.SVGText, { text: 'Hello xnew!', fontSize: 48, className: 'inline-block' });
      });

      // single outline via style (stroke halo bleeds outside the bbox)
      xnew('<div class="p-3 rounded-lg bg-slate-800 text-emerald-300">', () => {
        xnew(xbasics.SVGText, { text: 'GAME START', fontSize: 40, className: 'inline-block', style: 'stroke: #ffffff; stroke-width: 2;' });
      });

      // double outline: black inner + red outer (auto-sorted widest to back)
      xnew('<div class="p-3 rounded-lg bg-slate-100">', () => {
        xnew(xbasics.SVGText, {
          text: 'HELLO', fontSize: 64, className: 'inline-block',
          fill: '#ffffff',
          outline: [{ color: '#111827', width: 12 }, { color: '#ef4444', width: 24 }],
        });
      });

      // gold gradient fill (angle 90 = vertical)
      xnew('<div class="p-3 rounded-lg bg-slate-800">', () => {
        xnew(xbasics.SVGText, {
          text: 'GOLD', fontSize: 64, className: 'inline-block',
          fill: { gradient: { angle: 90, stops: [
            { offset: 0, color: '#fceabb' }, { offset: 0.5, color: '#f8b500' }, { offset: 1, color: '#8a5a00' },
          ] } },
        });
      });

      // gradient + outline + drop shadow combined
      xnew('<div class="p-3 rounded-lg bg-slate-100">', () => {
        xnew(xbasics.SVGText, {
          text: 'POP', fontSize: 72, className: 'inline-block',
          fill: { gradient: { stops: [{ offset: 0, color: '#67e8f9' }, { offset: 1, color: '#0284c7' }] } },
          outline: { color: '#003049', width: 10 },
          shadow: { dx: 6, dy: 6, color: 'rgba(0,0,0,.35)' },
        });
      });
    }
  </script>
</body>

</html>
