<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <script type="importmap">
    {
      "imports": {
        "@mulsense/xnew": "../../../dist/xnew.mjs"
      }
    }
  </script>
  <script src="../../../thirdparty/tailwindcss/playcdn.js"></script>
</head>

<body class="m-0 p-0 w-full h-screen overflow-hidden">
  <div id="main" class="relative w-full h-full"></div>
  <script type="module">
    import { xnew, xbasics } from '@mulsense/xnew';

    xnew(document.querySelector('#main'), Main);

    function Main(unit) {
      xnew.nest('<div class="p-4 flex flex-col gap-6">');
      xnew(Icons);
      xnew(Texts);
    }

    // xbasics.SVG nests an <svg> root with shared presentation attributes
    // (stroke / fill / line caps), so each shape child stays minimal.
    // stroke: 'currentColor' inherits the CSS text color of the wrapper.
    function Icons(unit) {
      xnew('<p class="font-bold">', 'xbasics.SVG');
      xnew.nest('<div class="flex gap-2">');

      xnew('<div class="size-16 text-red-500">', Heart);
      xnew('<div class="size-16 text-amber-500">', Star);
      xnew('<div class="size-16 text-green-600">', Check);
      xnew('<div class="size-16 text-blue-600">', Gear);
    }

    function Heart(unit) {
      xnew.extend(xbasics.SVG, { viewBox: '0 0 24 24', stroke: 'currentColor', strokeWidth: 1.5 });
      xnew('<path d="M12 20 4.5 12.5a4.6 4.6 0 1 1 7-6 4.6 4.6 0 1 1 7 6z">');
    }

    function Star(unit) {
      xnew.extend(xbasics.SVG, { viewBox: '0 0 24 24', stroke: 'currentColor', strokeWidth: 1.5 });
      xnew('<path d="M12 3 14.8 8.6 21 9.5 16.5 13.9 17.6 20 12 17.1 6.4 20 7.5 13.9 3 9.5 9.2 8.6z">');
    }

    function Check(unit) {
      xnew.extend(xbasics.SVG, { viewBox: '0 0 24 24', stroke: 'currentColor', strokeWidth: 2 });
      xnew('<path d="M4 12.5 9.5 18 20 6">');
    }

    function Gear(unit) {
      xnew.extend(xbasics.SVG, { viewBox: '0 0 24 24', stroke: 'currentColor', strokeWidth: 1.5 });
      xnew('<circle cx="12" cy="12" r="3.5">');
      xnew('<path d="M12 2v3M12 19v3M2 12h3M19 12h3M4.9 4.9l2.1 2.1M17 17l2.1 2.1M19.1 4.9 17 7M7 17l-2.1 2.1">');
    }

    // xbasics.SVGText renders text as SVG and auto-fits the viewBox to the
    // text bounding box; stroke + fill give a game-style outlined label.
    function Texts(unit) {
      xnew('<p class="font-bold">', 'xbasics.SVGText');
      xnew.nest('<div class="flex flex-col gap-2 items-start">');

      xnew('<div class="text-indigo-600">', () => {
        xnew(xbasics.SVGText, { text: 'Hello xnew!', fontSize: 48, className: 'inline-block' });
      });

      xnew('<div class="p-3 rounded-lg bg-slate-800 text-emerald-300">', () => {
        xnew(xbasics.SVGText, { text: 'GAME START', fontSize: 40, stroke: '#ffffff', strokeWidth: 2, className: 'inline-block' });
      });
    }
  </script>
</body>

</html>
