<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <script type="importmap">
    {
      "imports": {
        "@mulsense/xnew": "../../../dist/xnew.mjs"
      }
    }
  </script>
  <script src="../../../thirdparty/tailwindcss/playcdn.js"></script>
</head>

<body class="m-0 p-0 w-full h-screen overflow-hidden">
  <div id="main" class="relative w-full h-full"></div>
  <script type="module">
    import { xnew, xbasics, xicons } from '@mulsense/xnew';

    xnew(document.querySelector('#main'), (unit) => {
      xnew.nest('<div class="p-2 flex items-baseline gap-x-2">')
      xnew(MyAccordion)

      const button1 = xnew('<button class="h-8 px-2 border rounded-lg cursor-pointer hover:bg-gray-200">', 'open modal!');
      button1.on('click', () => xnew(MyModal));

      const button2 = xnew('<button class="relative h-8 px-2 border rounded-lg cursor-pointer hover:bg-gray-200">', 'open menu!');
      button2.on('click', () => xnew(button2.element, MyMenu));
    });

    function MyAccordion(unit) {
      xnew.nest('<div class="w-64 border rounded-lg">');

      let chevron;
      xnew('<div class="flex items-center select-none cursor-pointer">', (header) => {
        chevron = xnew((unit) => xnew.extend(xicons.ChevronRight, { className: 'size-4' }));
        xnew('<div class="my-2">', 'accordion (click me!)');
        header.on('click', () => unit.gate.toggle());
      });

      // Accordion creates the Gate from these props; follow its '-transition' to rotate the chevron
      const gate = xnew.extend(xbasics.Accordion, { gate: { open: true } }).gate;
      gate.on('-transition', ({ value }) => chevron.element.style.transform = `rotate(${value * 90}deg)`);

      xnew('<div class="p-2 border-t">', Contents);
    }

    function MyModal(unit) {
      // Overlay no longer opens itself: give it the Gate props, then open it from here
      xnew.extend(xbasics.Overlay, { gate: { open: false, duration: 300, easing: 'ease' }, style: 'background: rgba(0, 0, 0, 0.1);' });
      unit.gate.open();

      xnew.nest('<div class="absolute inset-0 m-auto w-max h-max">');
      xnew.nest('<div class="m-auto w-[300px] max-w-[80%] border rounded-lg bg-white">');

      xnew('<div class="p-2 flex justify-between">', () => {
        xnew('<span>', 'Title');
        xnew('<button class="cursor-pointer hover:opacity-50">', 'Close').on('click', () => unit.gate.close());
      });

      xnew('<div class="p-2 border-t">', Contents);
    }

    function MyMenu(unit) {
      // the dropdown is the only "inside"; a press anywhere else (incl. the opener button) closes it
      xnew((menu) => {
        xnew.nest('<div class="absolute top-full right-0 py-2">');
        // keep dropdown clicks from bubbling to the opener button (which would re-open a menu)
        menu.on('click', ({ event }) => event.stopPropagation());
        menu.on('pointerdown.outside', () => gate.close());

        // Accordion creates the Gate; open it once mounted, finalize the menu when it reports fully closed
        const gate = xnew.extend(xbasics.Accordion, { gate: { open: false } }).gate;
        gate.on('-closed', () => unit.finalize());
        gate.open();

        xnew.nest('<div class="w-[300px] border rounded-lg bg-white">');
        xnew('<div class="p-2">', Contents);
      });
    }

    function Contents(unit) {
      xnew('<span>', 'Contents');
      xnew('<ul>', () => {
        xnew('<li class="ml-2">', '1st item');
        xnew('<li class="ml-2">', '2nd item');
        xnew('<li class="ml-2">', '3rd item');
      });
    }
</script>
</body>

</html>
