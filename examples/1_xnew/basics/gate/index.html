<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <script type="importmap">
    {
      "imports": {
        "@mulsense/xnew": "../../../dist/xnew.mjs"
      }
    }
  </script>
  <script src="../../../thirdparty/tailwindcss/playcdn.js"></script>
</head>

<body class="m-0 p-0 w-full h-screen overflow-hidden">
  <div id="main" class="relative w-full h-full"></div>
  <script type="module">
    import { xnew, xbasics, xicons } from '@mulsense/xnew';

    xnew(document.querySelector('#main'), (unit) => {
      xnew.nest('<div class="p-2 flex items-baseline gap-x-2">')
      xnew(MyAccordion)

      const button1 = xnew('<button class="h-8 px-2 border rounded-lg cursor-pointer hover:bg-gray-200">', 'open modal!');
      button1.on('click', () => xnew(MyModal));

      const button2 = xnew('<button class="h-8 px-2 border rounded-lg cursor-pointer hover:bg-gray-200">', 'open menu!');
      button2.on('click', () => xnew(MyMenu, { anchor: button2 }));
    });

    function MyAccordion(unit) {
      xnew.nest('<div class="w-64 border rounded-lg">');

      xnew('<div class="flex items-center select-none cursor-pointer">', (header) => {
        const chevron = xnew((unit) => xnew.extend(xicons.ChevronRight, { className: 'size-4' }));
        unit.on('-transition', ({ value }) => chevron.element.style.transform = `rotate(${value * 90}deg)`);
        xnew('<div class="my-2">', 'accordion (click me!)');
        header.on('click', () => unit.gate.toggle());
      });

      xnew.extend(xbasics.Accordion, { gate: { open: true, duration: 200 } });

      xnew('<div class="p-2 border-t">', Contents);
    }

    function MyModal(unit) {
      xnew.extend(xbasics.Overlay, { gate: { open: false, duration: 200 }, className: 'bg-black/10' });
      unit.gate.on('-closed', () => unit.finalize());
      unit.gate.open();

      xnew.nest('<div class="absolute inset-0 m-auto w-max h-max">');
      xnew.nest('<div class="m-auto w-[300px] max-w-[80%] border rounded-lg bg-white">');
      // close on a press outside the dialog box (click.outside excludes the current element's subtree)
      unit.on('click.outside', () => unit.gate.close());

      xnew('<div class="p-2 flex justify-between">', () => {
        xnew('<span>', 'Title');
        xnew('<button class="cursor-pointer hover:opacity-50">', 'Close').on('click', () => unit.gate.close());
      });

      xnew('<div class="p-2 border-t">', Contents);
    }

    function MyMenu(unit, { anchor }) {
      // Overlay covers the page with a backdrop (so the button can't be re-triggered) and, via anchor,
      // gives a box tracking the button's rect; finalize this unit once the gate reports closed
      xnew.extend(xbasics.Overlay, { gate: { open: false, duration: 200 }, anchor });
      unit.gate.on('-closed', () => unit.finalize());

      // the dropdown hangs just below the tracked box; Accordion shares the Gate so both animate together
      xnew.nest('<div class="absolute top-full right-0 py-2">');
      // close on a press outside the dropdown (click.outside excludes the current element's subtree)
      unit.on('click.outside', () => unit.gate.close());
      xnew.extend(xbasics.Accordion, { gate: unit.gate });
      xnew.nest('<div class="w-[300px] border rounded-lg bg-white">');
      xnew('<div class="p-2">', Contents);

      unit.gate.open();
    }

    function Contents(unit) {
      xnew('<span>', 'Contents');
      xnew('<ul>', () => {
        xnew('<li class="ml-2">', '1st item');
        xnew('<li class="ml-2">', '2nd item');
        xnew('<li class="ml-2">', '3rd item');
      });
    }
</script>
</body>

</html>
