<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <script type="importmap">
    {
      "imports": {
        "@mulsense/xnew": "../../../dist/xnew.mjs"
      }
    }
  </script>
  <script src="../../../thirdparty/tailwindcss/playcdn.js"></script>
</head>

<body class="m-0 p-0 w-full h-screen overflow-hidden">
  <div id="main" class="relative w-full h-full"></div>
  <script type="module">
    import { xnew, xbasics } from '@mulsense/xnew';

    xnew(document.querySelector('#main'), (unit) => {
      xnew.extend(xbasics.Split, { direction: 'column' });

      // string → fixed size, number → flexible ratio
      unit.pane('3rem', Pane, { label: "header '3rem'", className: 'bg-slate-700 text-slate-100' });

      unit.pane(1, (main) => {
        xnew.extend(xbasics.Split, { direction: 'row' });
        main.pane(25, Pane, { label: 'side 25', className: 'bg-emerald-100 text-emerald-900' });

        main.pane(75, (content) => {
          xnew.extend(xbasics.Split, { direction: 'column' });
          content.pane(60, Pane, { label: 'content 75 × upper 60', className: 'bg-sky-100 text-sky-900' });
          content.pane(40, Pane, { label: 'content 75 × lower 40', className: 'bg-amber-100 text-amber-900' });
        });
      });

      unit.pane('2rem', Pane, { label: "footer '2rem'", className: 'bg-slate-700 text-slate-100' });
    });

    function Pane(unit, { label, className }) {
      xnew.nest(`<div class="w-full h-full flex items-center justify-center border border-white/50 text-sm ${className}">`, label);
    }
  </script>
</body>

</html>
