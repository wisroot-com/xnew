<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <script type="importmap">
    {
      "imports": {
        "@mulsense/xnew": "../../../dist/xnew.mjs"
      }
    }
  </script>
  <script src="../../../thirdparty/tailwindcss/playcdn.js"></script>
</head>

<body class="m-0 p-0 w-full h-screen overflow-hidden">
  <div id="main" class="relative w-full h-full"></div>
  <script type="module">
    import { xnew, xbasics } from '@mulsense/xnew';

    xnew(document.querySelector('#main'), (unit) => {
      xnew.extend(xbasics.Split, { direction: 'column' });

      // string size → fixed size, number size → flexible ratio
      unit.pane({ size: '3rem' }, () => {
        xnew(Block, { label: "header '3rem'", className: 'bg-slate-700 text-slate-100' });
      });

      unit.pane({ size: 1, direction: 'row' }, (main) => {
        main.pane({ size: 25 }, () => {
          xnew(Block, { label: 'side 25', className: 'bg-emerald-100 text-emerald-900' });
        });

        main.pane({ size: 75, direction: 'column' }, (content) => {
          content.pane({ size: 60 }, () => {
            xnew(Block, { label: 'content 75 × upper 60', className: 'bg-sky-100 text-sky-900' });
          });
          content.pane({ size: 40 }, () => {
            xnew(Block, { label: 'content 75 × lower 40', className: 'bg-amber-100 text-amber-900' });
          });
        });
      });

      unit.pane({ size: '2rem' }, () => {
        xnew(Block, { label: "footer '2rem'", className: 'bg-slate-700 text-slate-100' });
      });
    });

    function Block(unit, { label, className }) {
      xnew.nest(`<div class="w-full h-full flex items-center justify-center border border-white/50 text-sm ${className}">`, label);
    }
  </script>
</body>

</html>
