<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <script type="importmap">
    {
      "imports": {
        "@mulsense/xnew": "../../../dist/xnew.mjs"
      }
    }
  </script>
  <script src="../../../thirdparty/tailwindcss/playcdn.js"></script>
</head>

<body class="m-0 p-0 w-full h-screen overflow-hidden">
  <div id="main" class="relative w-full h-full"></div>
  <script type="module">
    import { xnew, xbasics } from '@mulsense/xnew';

    xnew(document.querySelector('#main'), (unit) => {
      xnew(Box);
      xnew(Controller);
    });

    function Controller(unit) {
      // prevent default event
      unit.on('touchstart document.contextmenu wheel', ({ event }) => event.preventDefault());

      xnew.nest('<div class="absolute left-0 right-0 bottom-0 w-full h-[30%]" style="container-type: size;">');

      // directional pad (left bottom)
      const dpad = xnew(xbasics.DPad, { className: 'absolute left-[5cqh] bottom-[5cqh] w-[90cqh] h-[90cqh]' });
      dpad.on('-down -move -up', ({ vector }) => xnew.emit('+move', { vector }));

      // analog stick (right bottom)
      const stick = xnew(xbasics.AnalogStick, { className: 'absolute right-[5cqh] bottom-[5cqh] w-[90cqh] h-[90cqh]' });
      stick.on('-down -move -up', ({ vector }) => xnew.emit('+move', { vector }));
    }

    function Box(unit) {
      const box = xnew.nest('<div class="absolute size-48 inset-0 m-auto bg-blue-500">');
      let current = { x: 0, y: 0, r: 0 };
      let move = { x: 0, y: 0 };
      unit.on('+move', ({ vector }) => move = vector);

      unit.on('update', () => {
        current.x += move.x * 10;
        current.y += move.y * 10;
        current.r += 1;
        box.style.transform = `translate(${current.x}px, ${current.y}px) rotate(${current.r}deg)`;
      });
    }
  </script>
</body>

</html>
