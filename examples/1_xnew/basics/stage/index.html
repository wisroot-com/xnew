<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <script type="importmap">
    {
      "imports": {
        "@mulsense/xnew": "../../../dist/xnew.mjs"
      }
    }
  </script>
  <script src="../../../thirdparty/tailwindcss/playcdn.js"></script>
</head>

<body class="m-0 p-0 w-full h-screen overflow-hidden bg-slate-900 text-white">
  <div id="main" class="relative w-full h-full"></div>
  <script type="module">
    import { xnew, xbasics } from '@mulsense/xnew';

    xnew(document.querySelector('#main'), () => {
      xnew.nest('<div class="absolute inset-0 flex flex-col items-center justify-center gap-5 select-none">');
      xnew(StoryDemo);    // branching flow: change(label) / next / prev + leave() transitions
      xnew(CarouselDemo); // array label + auto-advance using page.index
      xnew(EventLog);     // shows the events Stage emits
    });

    // ---- demo 1: branching page flow -------------------------------------------------------------
    // pages is a flat named map: a value is a single page or an array of pages. click the page for
    // next() (moves within the current array only); the buttons jump by label. every Stage event is
    // broadcast to the log below. each page implements the leave protocol (fade out-in).
    function StoryDemo(unit) {
      xnew.nest('<div class="flex flex-col gap-2">');

      // page viewport (Stage mounts the current page under itself, inside this box)
      const viewport = xnew('<div class="relative w-96 h-48 rounded-lg overflow-hidden border border-slate-600 cursor-pointer">');
      const stage = xnew(viewport, xbasics.Stage, {
        pages: {
          intro: [Page, { title: 'INTRO', text: 'buttons: change(label) / click: next()', color: 'bg-sky-700' }],
          story: [
            [Page, { title: 'STORY 1', text: 'story, index 0 — click to advance', color: 'bg-emerald-700' }],
            [Page, { title: 'STORY 2', text: 'story, index 1 — branch below', color: 'bg-teal-700' }],
            [Page, { title: 'STORY 3', text: 'story, index 2 — end of the array', color: 'bg-cyan-800' }],
          ],
          good: [Page, { title: 'GOOD END', text: 'label: good', color: 'bg-amber-600' }],
          bad:  [Page, { title: 'BAD END', text: 'label: bad', color: 'bg-rose-700' }],
        },
      });
      viewport.on('click', () => stage.next());

      stage.on('-pagechange', ({ label, index, fromLabel, fromIndex }) =>
        xnew.emit('+log', { text: `-pagechange { label: ${label}, index: ${index}, from: ${fromLabel}[${fromIndex}] }` }));

      // controls: prev/next (within the current array) + label jumps
      let status;
      xnew('<div class="w-96 flex items-center justify-center gap-2 text-sm">', () => {
        xnew('<button class="px-2 py-1 rounded bg-slate-700 hover:bg-slate-600 cursor-pointer">', '◀ prev')
          .on('click', () => stage.prev());
        xnew('<button class="px-2 py-1 rounded bg-slate-700 hover:bg-slate-600 cursor-pointer">', 'next ▶')
          .on('click', () => stage.next());
        status = xnew('<span class="flex-1 text-center font-mono text-xs text-slate-400">');
      });
      xnew('<div class="w-96 flex items-center justify-center gap-2 text-xs">', () => {
        for (const [label, jump] of [
          ["change('intro')", () => stage.change('intro')],
          ["change('story')", () => stage.change('story')],
          ["change('story', 1)", () => stage.change('story', 1)],
          ["change('good')", () => stage.change('good')],
          ["change('bad')", () => stage.change('bad')],
        ]) {
          xnew('<button class="px-1.5 py-1 rounded bg-indigo-800 hover:bg-indigo-700 cursor-pointer font-mono">', label)
            .on('click', jump);
        }
      });

      function paint() {
        const page = stage.page;
        status.element.textContent = `label: ${page.label}  index: ${page.index}`;
      }
      paint();
      stage.on('-pagechange', paint);
    }

    // leave protocol: entrance is self-managed in the body; leave() returns the exit transition,
    // and Stage finalizes this page only after it completes.
    function Page(unit, { title, text, color }) {
      xnew.nest(`<div class="size-full flex flex-col items-center justify-center gap-2 ${color}" style="opacity:0;">`);
      xnew.transition(({ value }) => unit.element.style.opacity = `${value}`, 250);
      xnew('<h1 class="text-2xl font-bold">', title);
      xnew('<p class="text-sm text-white/70">', text);
      return {
        leave() {
          return xnew.transition(({ value }) => unit.element.style.opacity = `${1 - value}`, 250);
        },
      };
    }

    // ---- demo 2: looping carousel ----------------------------------------------------------------
    // next() stops at the array end, so the auto-advance wraps by computing the index from page.
    function CarouselDemo(unit) {
      xnew.nest('<div class="relative w-96 h-14 rounded-lg overflow-hidden border border-slate-600">');
      const stage = xnew(xbasics.Stage, {
        pages: {
          banners: [
            [Banner, { text: 'an array label — page.index cycles', color: 'bg-indigo-700' }],
            [Banner, { text: 'auto-advance via xnew.interval', color: 'bg-cyan-700' }],
            [Banner, { text: 'page state is not preserved', color: 'bg-fuchsia-700' }],
          ],
        },
      });
      xnew.interval(() => {
        const page = stage.page;
        stage.change('banners', (page.index + 1) % 3);
      }, 1500);
    }

    function Banner(unit, { text, color }) {
      xnew.nest(`<div class="size-full flex items-center justify-center text-sm ${color}" style="opacity:0;">`);
      xnew.transition(({ value }) => unit.element.style.opacity = `${value}`, 200);
      xnew('<p>', text);
      return {
        leave() {
          return xnew.transition(({ value }) => unit.element.style.opacity = `${1 - value}`, 200);
        },
      };
    }

    // ---- event log --------------------------------------------------------------------------------
    function EventLog(unit) {
      xnew.nest('<div class="w-96 h-28 overflow-y-auto rounded-lg bg-black/60 font-mono text-xs text-emerald-300 p-2">');
      unit.on('+log', ({ text }) => {
        xnew('<div>', `> ${text}`);
        unit.element.scrollTop = unit.element.scrollHeight;
      });
    }
  </script>
</body>

</html>
