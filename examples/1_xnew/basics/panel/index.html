<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <script type="importmap">
    {
      "imports": {
        "@mulsense/xnew": "../../../dist/xnew.mjs"
      }
    }
  </script>
  <script src="../../../thirdparty/tailwindcss/playcdn.js"></script>
</head>

<body class="m-0 p-0 w-full h-screen overflow-hidden">
  <div id="main" class="relative w-full h-full"></div>
  <script type="module">
    import { xnew, xbasics } from '@mulsense/xnew';

    xnew(document.querySelector('#main'), (unit) => {
      xnew.nest('<div class="p-2 flex gap-2 items-baseline justify-between">');
        
      const textunit = xnew('<div class="m-0.5 p-1 rounded bg-gray-200">', 'Console');
      textunit.on('+console', ({ text }) => textunit.element.textContent = text);
      
      xnew(MyPanel);
    });

    function MyPanel(unit) {
      const panelbg = xnew.nest('<div class="absolute top-2 right-2 w-48 max-h-[calc(100vh-1rem)] text-sm border rounded-lg overflow-hidden shadow-lg bg-gray-100 text-green-900">');
      const panel = xnew(xbasics.Panel);

      panel.folder({ name: 'My Panel', open: true }, (folder) => {

        folder.folder({ name: 'background', open: true }, (subfolder) => {
          const colors = {
            'light gray': { background: '#f3f4f6', color: '#14532d' },
            'dark gray':  { background: '#1f2937', color: '#d1d5db' },
            'dark navy':  { background: '#172554', color: '#bfdbfe' },
          };
          for (const [name, { background, color }] of Object.entries(colors)) {
            subfolder.button({ name }).on('click', () => {
              Object.assign(panelbg.style, { background, color });
              xnew.emit('+console', { text: `${name} button clicked` });
            });
          }
          subfolder.separator();
        });

        folder.range({ name: 'data', value: 20, min: 0, max: 60, step: 2 }).on('input', ({ value }) => xnew.emit('+console', { text: `data changed to ${value}` }));
        folder.checkbox({ name: 'flag' }).on('input', ({ value }) => xnew.emit('+console', { text: `flag changed to ${value}` }));
        folder.listbox({ name: 'color', items: ['red', 'orange', 'yellow', 'green', 'cyan', 'blue', 'purple', 'magenta', 'brown', 'gray', 'black', 'white'] }).on('-change', ({ value }) => xnew.emit('+console', { text: `color changed to ${value}` }));
        folder.separator();

        const show = folder.checkbox({ name: 'show' });
        const subfolder = panel.folder({ open: false }, (subfolder) => {
          xnew('<p class="m-1">', 'hellow');
        });
        show.on('input', ({ value }) => value ? subfolder.gate.open() : subfolder.gate.close());
      });
      
    }
  </script>
</body>

</html>
