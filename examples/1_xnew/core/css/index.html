<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <script type="importmap">
    {
      "imports": {
        "@mulsense/xnew": "../../../dist/xnew.mjs"
      }
    }
  </script>
  <script src="../../../thirdparty/tailwindcss/playcdn.js"></script>
</head>

<body class="m-0 p-0 w-full h-screen overflow-hidden">
  <div id="main" class="relative w-full h-full"></div>

  <script type="module">
    import { xnew } from '@mulsense/xnew';

    xnew(document.querySelector('#main'), (unit) => {
      xnew(Buttons);
      xnew(BlueCard);
      xnew(GreenCard);
      xnew(Theme);
    });

    function Base(unit, { name }) {
      xnew.nest('<div class="m-2 p-2 border rounded-lg border-gray-600">');
      xnew('<div class="my-2">', name);
      xnew.nest('<div class="flex gap-x-2 flex-wrap">');
    }

    // xnew.css: keys are local class names; the returned map holds page-unique class names.
    // Native CSS nesting works inside each block (&:hover, @media, descendant selectors).
    function Buttons(unit) {
      xnew.extend(Base, { name: 'xnew.css: hover / active states' });

      const css = xnew.css({
        button: `
          height: 2rem; padding: 0 1rem; border-radius: 0.5rem;
          background: steelblue; color: white; cursor: pointer;
          transition: background 0.2s;
          &:hover { background: navy; }
          &:active { transform: translateY(2px); }
        `,
      });

      ['one', 'two', 'three'].forEach((label) => {
        xnew(`<button class="${css.button}">`, label);
      });
    }

    // BlueCard and GreenCard both use the local name "card",
    // but the generated class names are unique, so the styles never collide.
    function BlueCard(unit) {
      xnew.extend(Base, { name: 'xnew.css: local name "card" (blue)' });

      const css = xnew.css({
        card: `
          width: 12rem; padding: 0.5rem; border-radius: 0.5rem;
          background: #dbeafe; border: 1px solid #3b82f6;
          span { font-weight: bold; color: #1d4ed8; }
        `,
      });

      xnew(`<div class="${css.card}">`, () => {
        xnew('<span>', 'blue card');
        xnew('<div>', `class="${css.card}"`);
      });
    }

    function GreenCard(unit) {
      xnew.extend(Base, { name: 'xnew.css: local name "card" (green)' });

      const css = xnew.css({
        card: `
          width: 12rem; padding: 0.5rem; border-radius: 0.5rem;
          background: #dcfce7; border: 1px solid #22c55e;
          span { font-weight: bold; color: #15803d; }
        `,
      });

      xnew(`<div class="${css.card}">`, () => {
        xnew('<span>', 'green card');
        xnew('<div>', `class="${css.card}"`);
      });
    }

    // Custom properties are passed through as-is and inherit down the DOM tree:
    // the theme root sets --vars, and descendant components read them via var().
    function Theme(unit) {
      xnew.extend(Base, { name: 'xnew.css: custom properties (theme variables)' });

      const css = xnew.css({
        light: `
          --color-primary: #3b82f6;
          --color-surface: #dbeafe;
        `,
        dark: `
          --color-primary: #93c5fd;
          --color-surface: #1e3a5f;
        `,
      });

      const root = xnew.nest(`<div class="${css.light} flex gap-x-2 flex-wrap items-center">`);

      const button = xnew('<button class="h-8 px-2 border rounded-lg cursor-pointer hover:bg-gray-200">', 'switch to dark');
      button.on('click', () => {
        const dark = root.classList.contains(css.dark);
        root.classList.replace(dark ? css.dark : css.light, dark ? css.light : css.dark);
        button.element.textContent = dark ? 'switch to dark' : 'switch to light';
      });

      xnew(ThemedCard, { label: 'card A' });
      xnew(ThemedCard, { label: 'card B' });
    }

    function ThemedCard(unit, { label }) {
      const css = xnew.css({
        card: `
          width: 8rem; padding: 0.5rem; border-radius: 0.5rem;
          background: var(--color-surface, white);
          border: 1px solid var(--color-primary, gray);
          color: var(--color-primary, black);
          font-weight: bold;
          transition: background 0.3s, color 0.3s;
        `,
      });
      xnew(`<div class="${css.card}">`, label);
    }
  </script>
</body>

</html>
