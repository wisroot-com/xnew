<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>xnew cat_king (シャーロックホームズと猫王)</title>
  <script src="/thirdparty/tailwindcss/playcdn.js"></script>
  <!-- xnew / addons はサーバーが /xnew で配信するローカルビルド。pixi/three は /thirdparty から。 -->
  <script type="importmap">
    {
      "imports": {
        "@mulsense/xnew": "/xnew/xnew.mjs",
        "@mulsense/xnew/addons/xpixi": "/xnew/addons/xpixi.mjs",
        "@mulsense/xnew/addons/xthree": "/xnew/addons/xthree.mjs",
        "pixi.js": "/thirdparty/pixi/pixi.min.mjs",
        "three": "/thirdparty/three/three.module.js",
        "three/addons/": "/thirdparty/three/addons/",
        "@pixiv/three-vrm": "/thirdparty/three-vrm/three-vrm.module.min.js",
        "@pixiv/three-vrm-animation": "/thirdparty/three-vrm/three-vrm-animation.module.min.js",
        "voxelkit": "/thirdparty/voxelkit/voxelkit.mjs"
      }
    }
  </script>
</head>
<body class="m-0 w-full h-screen overflow-hidden bg-slate-900 relative">
  <div id="app" class="w-full h-full"></div>
  <p class="absolute top-1 left-2 m-0 text-xs"><span id="status" class="text-red-500">接続中…</span></p>
  <!-- socket.io クライアント（socket.io サーバーが自動配信。グローバル io を定義する） -->
  <script src="/socket.io/socket.io.js"></script>
  <script type="module" src="./index.js"></script>
</body>
</html>
